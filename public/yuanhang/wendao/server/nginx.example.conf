# Template only: insert an owned hostname and provision its TLS certificates.
# The Node service must bind 127.0.0.1, with no public access to its port.
server {
    listen 443 ssl;
    server_name chat.YOUR-DOMAIN;
    ssl_certificate /etc/letsencrypt/live/chat.YOUR-DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.YOUR-DOMAIN/privkey.pem;
    client_max_body_size 96k;
    location ~ ^/api/(chat|status)$ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 35s;
    }
    location / { return 404; }
}
