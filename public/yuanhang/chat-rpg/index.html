<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes">
<meta name="theme-color" content="#101e27"><meta name="description" content="远航·问道聊天RPG：在手机上管理存档、背包、人物状态、任务与事件账本。存档仅在本机保存。">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="./icon.svg">
<title>远航·问道 · 云间存档</title>
<style>
:root{color-scheme:dark;--bg:#0b161f;--panel:#14232d;--panel2:#1b2e38;--edge:#344952;--text:#eff0e9;--sub:#a2b8bb;--dim:#728f95;--gold:#dfbf87;--mint:#91ceb7;--red:#d9a7a2;--blue:#b6c5ee;--shadow:0 18px 44px #0003;--radius:18px}
*{box-sizing:border-box}html{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;-webkit-text-size-adjust:100%}body{margin:0;background:radial-gradient(circle at 100% 0,#1c3540 0,transparent 390px),var(--bg);color:var(--text);line-height:1.55;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.55;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:3px}a{color:var(--gold)}.shell{max-width:1140px;margin:auto;display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#10212a;border-right:1px solid var(--edge);padding:30px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.logo{font-size:24px;font-family:'Songti SC','STSong',serif;letter-spacing:2px;color:#f0debc}.tag{color:var(--dim);font-size:11px;letter-spacing:2px;margin:7px 0 30px}.side-nav{display:grid;gap:6px}.nav{border-radius:12px;background:transparent;color:var(--sub);text-align:left;padding:12px 15px}.nav.active{background:var(--panel2);color:var(--gold)}.side-foot{font-size:12px;color:var(--dim);margin-top:auto}.main{min-width:0;padding:29px 34px 105px}.top{display:flex;gap:20px;justify-content:space-between;align-items:center;margin-bottom:25px}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--gold)}h1,h2,h3,p{margin-top:0}h1{font-weight:500;letter-spacing:1px;font-family:'Songti SC','STSong',serif;font-size:30px;margin:5px 0 1px}h2{font-size:19px;font-weight:600;margin-bottom:14px}h3{font-size:15px;margin-bottom:8px}.muted{color:var(--sub)}.small{font-size:12px}.tiny{font-size:11px}.pill{font-size:11px;border:1px solid var(--edge);border-radius:30px;padding:4px 9px;color:var(--sub);display:inline-flex;align-items:center}.pill.warn{color:var(--gold);border-color:#7a6850}.pill.ok{color:var(--mint);border-color:#4c7d72}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.stack{display:grid;gap:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{background:linear-gradient(155deg,#182d37,#14232d);border:1px solid var(--edge);padding:19px;border-radius:var(--radius);min-width:0;box-shadow:var(--shadow)}.card.flat{background:var(--panel);box-shadow:none}.hero{background:linear-gradient(115deg,#213f46,#192c38 64%,#182833);border:1px solid #42636b;border-radius:20px;padding:24px;position:relative;overflow:hidden}.hero:after{content:'✦';position:absolute;right:13px;top:-36px;font-size:160px;color:#d1bc8f12;pointer-events:none}.hero > *{position:relative;z-index:1}.stat{font-family:Georgia,serif;font-size:27px;color:var(--gold);margin:4px 0}.btn{border-radius:11px;padding:10px 15px;font-weight:600;background:var(--panel2);border:1px solid #48616a;color:var(--text);display:inline-flex;justify-content:center;align-items:center;gap:6px;min-height:43px}.btn.primary{background:#b89b6b;color:#15212a;border-color:#b89b6b}.btn.ghost{background:transparent}.btn.danger{color:#ecb5b1;border-color:#875c5b}.btn.slim{min-height:34px;padding:6px 10px;font-size:12px}.btn:active{transform:translateY(1px)}input,textarea,select{background:#0f1e27;color:var(--text);border:1px solid #46606b;border-radius:11px;padding:11px 12px;min-width:0;width:100%;font-size:16px}textarea{min-height:100px;resize:vertical}.field{display:grid;gap:6px;color:var(--sub);font-size:12px}.field input,.field textarea,.field select{color:var(--text)}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.collection{display:grid;gap:10px}.entry{border:1px solid var(--edge);border-radius:12px;background:#10212a;padding:13px 14px}.entry .desc{font-size:12px;color:var(--sub);margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}.entry .name{font-weight:650}.entry .num{font-size:19px;font-weight:700;color:var(--gold)}.entry .right{text-align:right;white-space:nowrap}.empty{border:1px dashed #4b6670;border-radius:15px;padding:28px 15px;text-align:center;color:var(--sub)}.empty .mark{font-size:27px;display:block;margin-bottom:7px;color:var(--gold)}.notice{border:1px solid #6b6656;background:#302f29;color:#edd6a8;padding:12px 14px;border-radius:13px;font-size:12px}.hint{color:var(--sub);font-size:12px}.accent{color:var(--gold)}.good{color:var(--mint)}.line{border-top:1px solid var(--edge);margin:17px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tile{display:grid;gap:5px;padding:14px;background:#11232d;border:1px solid var(--edge);border-radius:12px}.tile strong{font-size:13px}.tile span{font-size:12px;color:var(--sub);white-space:pre-wrap}.listhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.footnav{display:none}.hide{display:none!important}.fileinput{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}.toast{position:fixed;z-index:30;left:50%;bottom:95px;transform:translateX(-50%);background:#e2c997;color:#15212a;border-radius:13px;padding:10px 17px;box-shadow:0 10px 40px #0008;font-size:13px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}.modalback{position:fixed;z-index:20;inset:0;background:#041016c9;display:grid;place-items:center;padding:18px}.modal{background:#172a35;border:1px solid #66818a;width:min(520px,100%);max-height:min(86dvh,780px);overflow:auto;border-radius:20px;padding:21px;box-shadow:0 22px 70px #0008}.modal-head{display:flex;align-items:center;justify-content:space-between}.modal-head h2{margin:0}.modal form{margin-top:14px;display:grid;gap:13px}.subhead{font-family:'Songti SC','STSong',serif;font-size:24px;font-weight:500}.keyline{display:grid;grid-template-columns:minmax(0,130px) 1fr;gap:9px 15px;font-size:13px}.keyline .label{color:var(--sub)}.keyline .value{overflow-wrap:anywhere}.progressdot{width:7px;height:7px;border-radius:50%;background:var(--mint);display:inline-block}.bottom-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.safearea{padding-bottom:env(safe-area-inset-bottom)}
@media(max-width:780px){.shell{display:block}.side{display:none}.main{padding:22px 16px calc(95px + env(safe-area-inset-bottom))}.top{align-items:flex-start;margin-bottom:20px}h1{font-size:25px}.grid{grid-template-columns:1fr}.card{padding:16px}.hero{padding:20px}.fields{grid-template-columns:1fr}.footnav{display:flex;position:fixed;z-index:10;bottom:0;left:0;right:0;padding:7px 6px calc(7px + env(safe-area-inset-bottom));background:#101f28f5;border-top:1px solid #45616c;justify-content:space-around;gap:2px;backdrop-filter:blur(12px)}.footnav .nav{display:grid;text-align:center;padding:7px 5px;min-width:0;flex:1;font-size:11px;gap:3px}.footnav .sym{font-size:19px}.toast{bottom:calc(95px + env(safe-area-inset-bottom))}}
@media(min-width:781px){.sym{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style>
</head>
<body>
<div class="shell"><aside class="side"><div class="logo">远航 · 问道</div><div class="tag">云间存档 · 聊天 RPG</div><nav class="side-nav" id="sidebar"></nav><div class="side-foot">✧ 单机本地存档<br>与正式网页游戏存档隔离<br>v1.1 · 2026.10</div></aside>
<main class="main" id="main"><header class="top"><div><div class="eyebrow">THE ARCHIVE OF WENDAO</div><h1>云间存档</h1><div class="muted small" id="subtitle">你的故事，由你保管。</div></div><button class="btn slim" id="slotBtn" title="切换存档">切换存档 ▾</button></header><section id="view" aria-live="polite"></section></main></div>
<nav class="footnav safearea" id="bottomnav" aria-label="主要导航"></nav><div role="status" aria-live="polite" class="toast" id="toast"></div><div id="modalRoot"></div>
<input class="fileinput" id="importFile" type="file" accept=".json,application/json" multiple aria-label="导入 JSON 存档">
<script>
(()=>{'use strict';
const KEY='wendao.chatRpg.local.v1', BACKUP='wendao.chatRpg.lastGood.v1', CLOUD_KEY='wendao.chatRpg.cloudPortal.v1';
const NAV=[['home','总览','⌂'],['characters','人物','♙'],['inventory','背包','◇'],['quests','任务','☷'],['chronicle','纪事','✦'],['saves','存档','▤']];
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=x=>JSON.parse(JSON.stringify(x)), uid=()=>('e_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9));
let db={version:1,selected:null,slots:[],history:{}},page='home',stored=true;
function showToast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>$('toast').classList.remove('show'),2600)}
function load(){try{let t=localStorage.getItem(KEY);if(t){let o=JSON.parse(t);if(o&&o.version===1&&Array.isArray(o.slots))db=o;}localStorage.setItem('_wendao_test','1');localStorage.removeItem('_wendao_test')}catch(e){stored=false;showToast('浏览器阻止本地保存，请导出备份文件。')}}
function persist(){try{if(!stored)return false;let old=localStorage.getItem(KEY);if(old)localStorage.setItem(BACKUP,old);localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){stored=false;showToast('本机存储失败：请立即导出存档');return false}}
function current(){return db.slots.find(s=>s.save_id===db.selected)||null}
function requireSave(){if(!current()){page='saves';render();showToast('请先创建或导入存档');return false}return true}
function mkSave(title,branch){let id='slot_'+uid(), b=branch||('branch_'+uid());return{schema_version:'0.1',revision:0,verification:'user_verified',notes:['从手机版存档管理器创建的空白档，无预置奖励和设定。'],save_id:id,branch_id:b,title,progress:{last_user_turn:0,current_location:null,in_world_time:null,pending_response_to:null},state:{world_facts:[],characters:[],currencies:[],inventory:[],skills:[],quests:[],open_threads:[],npc_schedules:[]},events:[]}}
function validate(s){if(!s||typeof s!=='object'||Array.isArray(s))throw Error('存档不是 JSON 对象');if(s.schema_version!=='0.1'||typeof s.save_id!=='string'||!s.save_id||typeof s.branch_id!=='string'||!s.branch_id)throw Error('存档格式或版本不支持（需要 v0.1）');if(!Number.isInteger(s.revision)||s.revision<0||!s.progress||!Number.isInteger(s.progress.last_user_turn)||s.progress.last_user_turn<0||!s.state||!Array.isArray(s.events))throw Error('存档缺少必要的进度、状态或事件数组');for(const k of ['world_facts','characters','currencies','inventory','skills','quests','open_threads','npc_schedules'])if(!Array.isArray(s.state[k]))throw Error('状态缺少 '+k+' 数组');let seen=new Set();for(const e of s.events){if(!e||typeof e.event_id!=='string'||!Number.isInteger(e.turn)||e.turn<0||typeof e.summary!=='string')throw Error('事件流水结构无效');let key=e.idempotency_key||e.event_id;if(seen.has(key))throw Error('事件流水有重复的幂等 ID');seen.add(key)}return true}
function pushHistory(s,reason){let key=s.save_id, arr=db.history[key]||[];arr.push({saved_at:new Date().toISOString(),reason,save:clone(s)});db.history[key]=arr.slice(-12)}
function commit(save,reason){let idx=db.slots.findIndex(x=>x.save_id===save.save_id);if(idx>=0)pushHistory(db.slots[idx],reason);save.revision=Number(save.revision||0)+1;if(idx>=0)db.slots[idx]=save;else db.slots.push(save);db.selected=save.save_id;persist();render();showToast('已保存在本机 · 修订 '+save.revision)}
function addNew(save){validate(save);if(db.slots.find(s=>s.save_id===save.save_id))throw Error('已有同名 ID 的存档');db.slots.push(save);db.selected=save.save_id;persist();render()}
function getTitle(s){return s?esc(s.title||'未命名存档'):'未选择存档'}
function statusTxt(s){return s?.verification==='partial_reconstruction'?'部分重建 · 未逐条核验':s?.verification==='user_verified'?'玩家确认档':'系统已核验'}
function buildNav(){for(const id of ['sidebar','bottomnav'])$(id).innerHTML=NAV.map(([k,n,ic])=>`<button type="button" class="nav ${page===k?'active':''}" data-nav="${k}" aria-current="${page===k?'page':'false'}"><span class="sym">${ic}</span>${n}</button>`).join('')}
function render(){buildNav();let s=current();$('subtitle').textContent=s?`${s.title||'未命名'} · 第 ${s.progress.last_user_turn} 回合`:'你的故事，由你保管。';$('slotBtn').textContent=s?'切换存档 ▾':'选择存档 ▾';let content={home:homeView,characters:charactersView,inventory:inventoryView,quests:questsView,chronicle:chronicleView,saves:savesView}[page];$('view').innerHTML=content(s)}
function noSave(){return `<div class="empty"><span class="mark">✧</span><h2>还没有载入故事</h2><p class="small">导入原有 JSON 存档，或者创建一个新故事。<br>不会自动读取其他聊天、网页游戏或云端数据。</p><div class="bottom-actions" style="justify-content:center"><button class="btn primary" data-action="import">导入存档</button><button class="btn" data-action="new">创建空白档</button></div></div>`}
function homeView(s){if(!s)return noSave();let inv=s.state.inventory.reduce((a,x)=>a+(Number(x.quantity)||0),0), opens=s.state.open_threads.filter(x=>!['done','resolved','closed'].includes(x.state)), pending=s.progress.pending_response_to;return `<div class="stack"><div class="hero"><div class="eyebrow">当前世界线 · ${esc(s.branch_id)}</div><h2 class="subhead" style="margin:8px 0">${getTitle(s)}</h2><div class="muted small">${esc(s.progress.current_location||'地点未记录')} · ${esc(s.progress.in_world_time||'时间未记录')}</div><div class="row wrap" style="margin-top:14px"><span class="pill warn">第 ${s.progress.last_user_turn} 回合</span><span class="pill">修订 ${s.revision}</span><span class="pill">${esc(statusTxt(s))}</span></div></div>${!stored?`<div class="notice">本机保存不可用。请务必使用「导出 JSON」备份当前内容。</div>`:''}<div class="grid"><div class="card flat"><div class="muted small">背包物品数量</div><div class="stat">${inv}</div><div class="hint">${s.state.inventory.length} 种物品 · 不虚构未确认奖励</div></div><div class="card flat"><div class="muted small">未解悬念</div><div class="stat">${opens.length}</div><div class="hint">${s.state.quests.filter(q=>!['done','completed','failed'].includes(q.state)).length} 项进行中或待核验任务</div></div></div><div class="card"><div class="listhead"><h2 style="margin:0">下一幕</h2><button class="btn slim" data-action="editProgress">编辑进度</button></div><div class="small" style="white-space:pre-wrap">${esc(pending||'尚未记录等待回答的问题。')}</div></div><div class="card"><h2>每回合真正入账</h2><p class="muted small">剧情继续后，将结算中的获得、消耗与事实记录进本地账本。相同事件 ID 不重复入账。</p><div class="bottom-actions"><button class="btn primary" data-action="itemEvent">+ 物品结算</button><button class="btn" data-action="textEvent">+ 记一件事</button><button class="btn" data-action="settlement">导入结算 JSON</button></div></div><div class="card flat"><h2>跨聊天续玩</h2><p class="hint">复制完整存档与续玩协议，粘贴到新聊天；或导出 JSON 作为附件。聊天生成的变更不会自动回写这里，需要手动入账/导入。</p><div class="bottom-actions"><button class="btn" data-action="copyResume">复制续玩内容</button><button class="btn" data-action="export">导出当前存档</button></div></div></div>`}
function charactersView(s){if(!s)return noSave();return `<div class="stack"><div class="listhead"><h2 style="margin:0">人物档案</h2><button class="btn slim" data-action="charEdit">编辑状态</button></div>${!s.state.characters.length?`<div class="empty">尚未登记人物。可以手动登记人物和状态。</div>`:`<div class="collection">${s.state.characters.map(c=>`<div class="card flat"><div class="row between wrap"><h2 style="margin:0">${esc(c.name||c.role||c.id)}</h2><span class="pill">${esc(c.role||'人物')}</span></div><div class="hint">${esc(c.id)}</div><div class="line"></div><div class="keyline">${Object.entries(c.status||{}).length?Object.entries(c.status).map(([k,v])=>`<div class="label">${esc(({qi_blood:'气血',mana:'灵力',cultivation:'修为',energy:'精力',mood:'心情',satiety:'饱腹',health:'健康',autonomy:'自主行动',location:'位置'})[k]||k)}</div><div class="value">${esc(v===null?'未记录':typeof v==='object'?JSON.stringify(v):v)}</div>`).join(''):'<div class="muted">暂无可确认数值</div>'}</div></div>`).join('')}</div>`}</div>`}
function inventoryView(s){if(!s)return noSave();let currencies=s.state.currencies||[];return `<div class="stack"><div class="listhead"><h2 style="margin:0">背包与灵石</h2><button class="btn slim primary" data-action="itemEvent">物品结算</button></div><div class="notice">空背包代表尚未确认为可用物品，不代表剧情里从未出现。每一笔增减都应登记来源。</div>${currencies.length?`<div class="grid">${currencies.map(c=>`<div class="tile"><strong>${esc(c.name||c.currency_id||'货币')}</strong><div class="num">${esc(c.amount??'未记录')}</div></div>`).join('')}</div>`:''}${s.state.inventory.length?`<div class="collection">${s.state.inventory.map(it=>`<div class="entry row between"><div><div class="name">${esc(it.name||it.item_id||'未知物品')}</div><div class="desc">${esc([it.quality,it.owner,it.source].filter(Boolean).join(' · ')||it.item_id||'')}</div></div><div class="right"><div class="num">× ${esc(it.quantity??'?')}</div><button class="btn slim ghost" data-action="itemEvent" data-id="${esc(it.item_id||'')}">结算</button></div></div>`).join('')}</div>`:`<div class="empty"><span class="mark">◇</span>背包尚未有正式入账的物品。<br><span class="small">例如暖火符画过不等于成品已获得。</span></div>`}</div>`}
function questsView(s){if(!s)return noSave();return `<div class="stack"><div class="listhead"><h2 style="margin:0">任务与悬念</h2><button class="btn slim" data-action="threadEdit">登记悬念</button></div><h3>任务</h3>${(s.state.quests||[]).length?`<div class="collection">${s.state.quests.map(q=>`<div class="entry"><div class="row between"><span class="name">${esc(q.name||q.quest_id)}</span><span class="pill">${esc(q.state)}</span></div><div class="desc">来源：回合 ${esc(q.source_turn??'未记载')}</div></div>`).join('')}</div>`:`<div class="empty">暂无登记任务</div>`}<h3 style="margin-top:8px">尚未解开的线索</h3>${(s.state.open_threads||[]).length?`<div class="collection">${s.state.open_threads.map(x=>`<div class="entry"><div class="row between"><span class="name">${esc(x.question||x.id)}</span><span class="pill">${esc(x.state||'open')}</span></div></div>`).join('')}</div>`:`<div class="empty">暂无悬念</div>`}</div>`}
function chronicleView(s){if(!s)return noSave();return `<div class="stack"><div class="listhead"><h2 style="margin:0">世界纪事 · ${s.events.length}</h2><button class="btn slim" data-action="textEvent">+ 记录</button></div><div class="hint">以已提交事件为准；重复读取或重复导入同一个事件 ID 不会再次计算。</div>${s.events.length?`<div class="collection">${[...s.events].reverse().map(e=>`<div class="entry"><div class="row between wrap"><span class="pill">回合 ${esc(e.turn)}</span><span class="pill ${e.status==='canonical'?'ok':'warn'}">${esc(e.status||'pending')}</span></div><div style="margin-top:9px">${esc(e.summary)}</div>${e.changes?.length?`<div class="desc">${e.changes.map(c=>`${esc(c.target)}: ${esc(c.before)} → ${esc(c.after)}`).join('；')}</div>`:''}<div class="tiny muted" style="margin-top:6px">${esc(e.event_id)}</div></div>`).join('')}</div>`:`<div class="empty">还没有任何事件记录</div>`}</div>`}
function savesView(s){let hist=s?(db.history[s.save_id]||[]):[],cloudUrl='';try{cloudUrl=localStorage.getItem(CLOUD_KEY)||''}catch(e){}return `<div class="stack"><div class="card"><h2>存档槽 · ${db.slots.length}</h2><div class="collection">${db.slots.map(x=>`<div class="entry row between"><div style="min-width:0"><div class="name">${esc(x.title||x.save_id)}</div><div class="desc">${esc(x.branch_id)} · 回合 ${x.progress.last_user_turn} · 修订 ${x.revision}</div></div><button class="btn slim ${x.save_id===db.selected?'primary':''}" data-action="select" data-id="${esc(x.save_id)}">${x.save_id===db.selected?'使用中':'载入'}</button></div>`).join('')||'<div class="muted small">没有存档。欢迎创建。</div>'}</div><div class="bottom-actions"><button class="btn primary" data-action="import">导入 JSON</button><button class="btn" data-action="new">创建新档</button></div></div>${s?`<div class="card"><h2>当前存档管理</h2><div class="keyline"><div class="label">存档 ID</div><div class="value">${esc(s.save_id)}</div><div class="label">剧情分支</div><div class="value">${esc(s.branch_id)}</div><div class="label">版本 / 修订</div><div class="value">${esc(s.schema_version)} / ${s.revision}</div><div class="label">可信度</div><div class="value">${esc(statusTxt(s))}</div></div><div class="bottom-actions"><button class="btn" data-action="checkpoint">创建检查点</button><button class="btn" data-action="export">导出当前档</button><button class="btn" data-action="exportAll">导出全部</button></div></div><div class="card"><h2>历史检查点 · ${hist.length}</h2><p class="hint">本机仅保留最近 12 个检查点。恢复旧状态将另建分支，不会抹去现存正史。</p>${hist.length?`<div class="collection">${[...hist].reverse().map((h,i)=>`<div class="entry row between"><div><div class="name">${esc(h.reason||'存档')}</div><div class="desc">${esc(new Date(h.saved_at).toLocaleString('zh-CN'))} · 修订 ${h.save.revision}</div></div><button class="btn slim" data-action="restore" data-idx="${hist.length-1-i}">另存分支</button></div>`).join('')}</div>`:`<div class="empty">暂无历史检查点</div>`}</div><div class="card flat"><h2>危险操作</h2>< function formItem(id=''){let s=current(), it=s.state.inventory.find(x=>x.item_id===id), opts=s.state.inventory.map(x=>`<option value="${esc(x.item_id)}" ${x.item_id===id?'selected':''}>${esc(x.name||x.item_id)}</option>`).join('');modal('物品结算',`<form id="itemForm"><div class="notice">仅在剧情已明确获得或消耗物品时结算；没有依据就不要添加。</div><label class="field">选择已有物品（也可手动填写新 ID）<select name="existing"><option value="">— 新物品 —</option>${opts}</select></label><label class="field">物品 ID（新物品填写英文 ID）<input name="item_id" maxlength="80" placeholder="warm_talisman" value="${esc(it?.item_id||'')}"></label><label class="field">名称<input name="name" maxlength="80" required value="${esc(it?.name||'')}"></label><div class="fields"><label class="field">数量变化（负数为消耗）<input name="delta" type="number" step="1" required value="1"></label><label class="field">结算回合<input name="turn" type="number" min="0" required value="${s.progress.last_user_turn}"></label></div><label class="field">来源 / 事件说明<input name="reason" required maxlength="250" placeholder="例如：回合14先生确认证符可用"></label><label class="field">事件 ID（可不填，自动生成）<input name="event_id" maxlength="100" placeholder="复制外部结算时填写固定 ID 防止重复"></label><button class="btn primary" type="submit">确认入账</button></form>`);let e=$('itemForm').elements; e.existing.addEventListener('change',ev=>{let i=s.state.inventory.find(x=>x.item_id===ev.target.value);if(i){e.item_id.value=i.item_id;e.name.value=i.name||''}})}
function formText(){let s=current();modal('记录世界纪事',`<form id="textForm"><label class="field">发生回合<input name="turn" type="number" min="0" max="999999" value="${s.progress.last_user_turn}" required></label><label class="field">事件内容<textarea name="summary" required maxlength="3000" placeholder="写入可核实的事实，不把待定推测直接确认为正史"></textarea></label><label class="field">可信状态<select name="status"><option value="canonical">已确认</option><option value="pending">待确认</option><option value="unverified">未核验</option></select></label><label class="field">事件 ID（选填）<input name="event_id" maxlength="100" placeholder="默认自动生成"></label><button class="btn primary" type="submit">记录到事件账本</button></form>`)}
function formChar(){let s=current();modal('登记 / 修改人物状态',`<form id="charForm"><label class="field">选择现有人物<select name="existing"><option value="">— 新人物 —</option>${s.state.characters.map(x=>`<option value="${esc(x.id)}">${esc(x.name||x.id)}</option>`).join('')}</select></label><label class="field">人物 ID<input name="char_id" required maxlength="80" placeholder="wenzhiyao"></label><label class="field">姓名<input name="name" required maxlength="80" placeholder="温知遥"></label><label class="field">状态字段<select name="key"><option value="health">健康 / 伤势</option><option value="location">位置</option><option value="energy">精力</option><option value="mood">心情</option><option value="qi_blood">气血</option><option value="mana">灵力</option><option value="cultivation">修为</option><option value="satiety">饱腹感</option></select></label><label class="field">新状态（留空表示未知，不是零）<input name="value" maxlength="120" placeholder="例如：仍在疗养中"></label><label class="field">剧情依据<input name="reason" required maxlength="250" placeholder="例如：第12回合敷药后的状态"></label><button class="btn primary" type="submit">更新并记录事件</button></form>`);let f=$('charForm').elements;f.existing.addEventListener('change',e=>{let c=s.state.characters.find(x=>x.id===e.target.value);if(c){f.char_id.value=c.id;f.name.value=c.name||c.id;f.value.value=String(c.status?.[f.key.value]??'')}});f.key.addEventListener('change',()=>{let c=s.state.characters.find(x=>x.id===f.existing.value);f.value.value=String(c?.status?.[f.key.value]??'')})}

function formSettlement(){modal('粘贴结构化结算',`<form id="settlementForm"><p class="hint">支持正式 JSON 事件对象：event_id、turn、summary、changes。当前自动结算支持 <code>inventory.物品ID</code> 的数量变化。旧账不重复入账；其他复杂变化将提示，绝不默默丢弃。</p><label class="field">JSON 结算<textarea name="json" rows="9" required spellcheck="false" placeholder='{"event_id":"x_t14_reward","turn":14,"type":"item","status":"canonical","summary":"获得暖火符","changes":[{"target":"inventory.warm_talisman","before":0,"delta":1,"after":1,"name":"暖火符"}]}'></textarea></label><button class="btn primary" type="submit">校验并结算</button></form>`)}
function recordEvent(s,e){let id=e.idempotency_key||e.event_id;if(s.events.some(x=>(x.idempotency_key||x.event_id)===id||x.event_id===e.event_id))throw Error('该事件已结算，不能重复入账');s.events.push(e);s.progress.last_user_turn=Math.max(s.progress.last_user_turn,e.turn);commit(s,'事件结算 · '+e.event_id)}
function handleSettlement(e){if(!e||typeof e!=='object'||Array.isArray(e)||!e.event_id||!Number.isInteger(e.turn)||e.turn<0||typeof e.summary!=='string'||!e.summary.trim())throw Error('结算缺少 event_id、合法回合或摘要');let s=clone(current());if(s.events.some(x=>x.event_id===e.event_id||(e.idempotency_key&&x.idempotency_key===e.idempotency_key)))throw Error('该事件已处理：禁止重复入账');if(e.status&&e.status!=='canonical')throw Error('仅允许直接结算已确认的 canonical 事件');let changes=e.changes||[];if(!Array.isArray(changes))throw Error('changes 必须是数组');if(changes.length>50)throw Error('单笔结算变化过多');for(const ch of changes){const m=/^inventory\.([a-zA-Z0-9_-]+)$/.exec(ch.target||'');if(!m)throw Error('暂不支持自动处理 '+ch.target+'；请改用对应手动登记表单');let id=m[1], it=s.state.inventory.find(x=>x.item_id===id);let before=it?it.quantity:0;if(!Number.isInteger(before)||!Number.isInteger(ch.before)||!Number.isInteger(ch.delta)||!Number.isInteger(ch.after))throw Error('物品数量必须是整数');if(before!==ch.before||before+ch.delta!==ch.after||ch.after<0)throw Error('账本数量不一致：'+id+'，当前 '+before);if(!it){it={item_id:id,name:String(ch.name||id).slice(0,100),quantity:0,source:'事件 '+e.event_id};s.state.inventory.push(it)}it.quantity=ch.after}
let normalized={event_id:String(e.event_id),idempotency_key:String(e.idempotency_key||e.event_id),turn:e.turn,type:String(e.type||'settlement'),status:'canonical',summary:e.summary,changes:clone(changes)};recordEvent(s,normalized)}
function doAction(action,data){try{let s=current();switch(action){case'close':close();return;case'import':$('importFile').click();return;case'new':formNew();return;case'select':db.selected=data.id;persist();render();showToast('已切换世界线');return;case'editProgress':if(requireSave())formEditProgress();return;case'itemEvent':if(requireSave())formItem(data.id||'');return;case'textEvent':if(requireSave())formText();return;case'charEdit':if(requireSave())formChar();return;case'threadEdit':if(requireSave())formThread();return;case'settlement':if(requireSave())formSettlement();return;case'checkpoint':if(!requireSave())return;pushHistory(s,'手动检查点');persist();render();showToast('已创建本机检查点');return;case'export':if(s)downloadJSON(s,`远航问道_${safeName(s.branch_id)}_回合${s.progress.last_user_turn}.json`);return;case'setCloudUrl':{let currentUrl='';try{currentUrl=localStorage.getItem(CLOUD_KEY)||''}catch(e){}let value=prompt('粘贴你自己部署的 Google Apps Script 私人网页地址（以 /exec 结尾）',currentUrl);if(value===null)return;value=value.trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(value))throw Error('网址不是有效的 Apps Script 发布地址');localStorage.setItem(CLOUD_KEY,value);render();showToast('已保存安全云端入口');return}case'openCloud':{let url=localStorage.getItem(CLOUD_KEY);if(url)window.open(url,'_blank','noopener');return}case'exportAll':downloadJSON({format:'wendao-chat-rpg-bundle-v1',exported_at:new Date().toISOString(),slots:db.slots},'远航问道_全部存档备份.json');return;case'copyResume':if(s)copyResume(s);return;case'restore':if(!s)return;let snap=db.history[s.save_id]?.[Number(data.idx)]?.save;if(!snap)return;if(!confirm('将旧检查点复制为【新的分支】。不会覆盖当前存档，继续吗？'))return;let cp=clone(snap);cp.save_id='slot_'+uid();cp.branch_id=snap.branch_id+'_recovered_'+Date.now().toString(36);cp.title=(snap.title||'未命名')+' · 历史分支';cp.revision=0;cp.notes=[...(cp.notes||[]),'从历史检查点复制，新建独立分支，不覆盖原档。'];addNew(cp);showToast('已建立恢复分支');return;case'delete':if(!s)return;if(!confirm('确认删除本机当前存档？此操作无法撤销。建议先导出。'))return;db.slots=db.slots.filter(x=>x.save_id!==s.save_id);delete db.history[s.save_id];db.selected=db.slots[0]?.save_id||null;persist();render();showToast('已删除本机档');return;default:return}}catch(err){alert('操作未完成：'+err.message)}}
function safeName(t){return String(t||'save').replace(/[^a-zA-Z0-9\u3400-\u9FFF_-]/g,'_').slice(0,60)}
function downloadJSON(obj,name){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);showToast('已生成 JSON 文件，请保存到「文件」App')}
async function copyResume(s){const prompt=`请作为《远航·问道》沉浸式聊天 RPG 主持人继续游戏。下面 JSON 是本分支的最新本机存档，请严格按其 branch_id、revision、progress、state、events 续写。不可重置伤势、物品、已发生事件与伏笔；数值不明时保持未知，不要自行填零或创造奖励。每回合最后附【本回合结算】，已确认变更附带固定 event_id、turn、status:canonical、summary、changes；物品增减格式为 target:inventory.物品ID、before、delta、after；同一个 event_id 不可重复结算。发生关键变化后请给我完整可导入的存档 JSON，供手动更新本机存档。当前该网页与 ChatGPT 没有自动连接，回复不会自动同步。\n\n【存档 JSON】\n${JSON.stringify(s,null,2)}`;try{await navigator.clipboard.writeText(prompt);showToast('续玩指令与完整档案已复制')}catch(e){modal('手动复制续玩内容',`<textarea id="copyFallback" rows="12" readonly>${esc(prompt)}</textarea><div class="hint">全选复制后粘贴到新聊天。</div>`);$('copyFallback').select()}}
async function importFiles(files){let successes=0,skips=0;for(const file of files){try{if(file.size>3*1024*1024)throw Error('文件超过 3MB 限制');let raw=JSON.parse(await file.text()),arr=raw?.format==='wendao-chat-rpg-bundle-v1'?raw.slots:Array.isArray(raw)?raw:[raw];if(!Array.isArray(arr)||arr.length>25)throw Error('存档包数量异常');for(const rawS of arr){validate(rawS);let s=clone(rawS),existing=db.slots.find(x=>x.save_id===s.save_id);if(existing){let ask=confirm(`发现相同存档 ID：${s.title||s.save_id}\n确定以导入版本覆盖本机版本吗？\n取消则跳过这一份。（建议先导出全部备份）`);if(!ask){skips++;continue}pushHistory(existing,'导入覆盖前自动备份');db.slots=db.slots.filter(x=>x.save_id!==s.save_id)}db.slots.push(s);db.selected=s.save_id;successes++}}catch(err){alert(`导入「${file.name}」失败：${err.message}`)}}persist();render();showToast(`成功导入 ${successes} 份，跳过 ${skips} 份`)}
function onSubmit(f){try{const d=new FormData(f),get=k=>String(d.get(k)||'').trim();let s=current();switch(f.id){case'newForm':{let title=get('title');if(!title)throw Error('请填写存档标题');let n=mkSave(title,get('branch'));addNew(n);page='home';break}
case'progressForm':{let cp=clone(s),newTurn=Number(get('turn'));if(!Number.isInteger(newTurn)||newTurn<0)throw Error('回合编号无效');let before=clone(cp.progress);if(newTurn<before.last_user_turn)throw Error('不能倒退回合，请使用历史检查点另存分支');cp.progress={...cp.progress,last_user_turn:newTurn,current_location:get('location')||null,in_world_time:get('time')||null,pending_response_to:get('pending')||null};let evId=uid();cp.events.push({event_id:evId,idempotency_key:evId,turn:newTurn,type:'progress_update',summary:`更新剧情进度：${cp.progress.current_location||'地点未记录'}`,status:'canonical',changes:[{target:'progress',before,after:clone(cp.progress)}]});commit(cp,'更新剧情进度');break}
case'itemForm':{let cp=clone(s),selected=get('existing'),id=get('item_id')||selected,name=get('name'),delta=Number(get('delta')),turn=Number(get('turn')),event_id=get('event_id')||uid();if(!/^[a-zA-Z0-9_-]{1,80}$/.test(id))throw Error('物品 ID 仅支持英文、数字、横线和下划线');if(!Number.isInteger(delta)||delta===0||!Number.isInteger(turn)||turn<0||!get('reason'))throw Error('数量、回合或事件来源无效');if(cp.events.some(e=>e.event_id===event_id||e.idempotency_key===event_id))throw Error('事件 ID 已存在');let it=cp.state.inventory.find(x=>x.item_id===id),before=it?it.quantity:0;if(!Number.isInteger(before)||before+delta<0)throw Error('物品不足或库存数据异常，不能扣成负数');let after=before+delta;if(!it){it={item_id:id,name,quantity:0,source:get('reason')};cp.state.inventory.push(it)}it.name=name;it.quantity=after;recordEvent(cp,{event_id,idempotency_key:event_id,turn,type:'item_settlement',summary:get('reason'),status:'canonical',changes:[{target:'inventory.'+id,name,before,delta,after}]});break}
case'textForm':{let cp=clone(s),turn=Number(get('turn')),event_id=get('event_id')||uid();if(!Number.isInteger(turn)||turn<0)throw Error('回合无效');recordEvent(cp,{event_id,idempotency_key:event_id,turn,type:'world_event',summary:get('summary'),status:get('status'),changes:[]});break}
case'charForm':{let cp=clone(s),id=get('char_id'),name=get('name'),field=get('key');if(!/^[a-zA-Z0-9_-]{1,80}$/.test(id))throw Error('人物 ID 只能使用英数字');let c=cp.state.characters.find(x=>x.id===id),before=c?.status?.[field]??null,after=get('value')||null;if(!c){c={id,name,role:'NPC',status:{}};cp.state.characters.push(c)}c.name=name;c.status=c.status||{};c.status[field]=after;let evId=uid();cp.events.push({event_id:evId,idempotency_key:evId,turn:cp.progress.last_user_turn,type:'character_status',summary:`${name}：${get('reason')}`,status:'canonical',changes:[{target:`characters.${id}.status.${field}`,before,after}]});commit(cp,'人物状态更新');break}
case'threadForm':{let cp=clone(s),thread={id:uid(),question:get('question'),state:get('status')};cp.state.open_threads.push(thread);let evId=uid();cp.events.push({event_id:evId,idempotency_key:evId,turn:cp.progress.last_user_turn,type:'thread',summary:get('reason')+' · '+thread.question,status:'canonical',changes:[{target:'open_threads.'+thread.id,before:null,after:thread}]});commit(cp,'登记剧情悬念');break}
case'settlementForm':{let obj=JSON.parse(get('json'));handleSettlement(obj);break}default:return}close();render()}catch(err){alert('未保存：'+err.message)}}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-nav]');if(nav){page=nav.dataset.nav;render();window.scrollTo({top:0});return}let btn=e.target.closest('[data-action]');if(btn){doAction(btn.dataset.action,btn.dataset);return}if(e.target.id==='slotBtn'){page='saves';render()}if(e.target.id==='backdrop')close()});document.addEventListener('submit',e=>{if(e.target.closest('form')){e.preventDefault();onSubmit(e.target)}});$('importFile').addEventListener('change',e=>{const files=Array.from(e.target.files||[]);e.target.value='';if(files.length)importFiles(files)});window.addEventListener('storage',e=>{if(e.key===KEY){showToast('检测到另一页面修改了存档，建议刷新以避免冲突');stored=false}});
load();if(!db.selected&&db.slots[0])db.selected=db.slots[0].save_id;render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});
