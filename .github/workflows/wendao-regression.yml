name: WenDao Regression Checks
on:
  pull_request:
    paths:
      - 'public/yuanhang/**'
      - '.github/workflows/wendao-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run WenDao tests
        run: node --test public/yuanhang/tests/*.mjs
      - name: Build original application
        run: npm run build
